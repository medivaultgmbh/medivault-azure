###############################################################################
# MediVault GRC Gate
#
# Three independent jobs:
#
#   1. policy-gate           Plans the FULL reference architecture and runs
#                            tfsec + OPA/Conftest against it. Must PASS.
#                            Never applies - this architecture is the documented
#                            target state, not something we can afford to run.
#
#   2. policy-gate-negative  Plans a deliberately non-compliant fixture and
#                            asserts Conftest REJECTS it. Must FAIL to pass.
#                            A gate that has never failed is not evidence of
#                            control; this job is what makes the gate credible.
#
#   3. deploy-demo           Manual dispatch only. Applies terraform/minimal
#                            (governance plane, ~EUR 2/month) and uploads a
#                            cosign-signed evidence bundle to the evidence vault.
#
# Authentication is OIDC federation throughout. No client secrets.
#
# DEPENDABOT
#
# Workflows triggered by Dependabot run with a read-only token and cannot be
# granted id-token: write, so OIDC federation is unavailable and no Azure call
# can succeed. Rather than let both required checks fail - which would make
# every dependency PR unmergeable - those PRs run a REDUCED gate: format, init
# and validate, with the plan-based policy evaluation skipped.
#
# That subset is still meaningful for the thing Dependabot actually changes: a
# provider version bump that breaks schema compatibility fails `terraform
# validate`. What it cannot do is evaluate policy, so the run summary says so
# explicitly rather than implying a full pass.
###############################################################################

name: GRC Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_demo:
        description: "Apply terraform/minimal after the gate passes"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  CONFTEST_VERSION: "0.56.0"

concurrency:
  group: grc-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ############################################################################
  # 1. Policy gate against the reference architecture
  ############################################################################
  policy-gate:
    name: Policy gate (reference architecture)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Skipped for Dependabot: OIDC is unavailable on those runs.
      - name: Azure login (OIDC)
        if: github.actor != 'dependabot[bot]'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest
          conftest --version

      # Unit-test the policies before running them. The negative test proves the
      # gate rejects a bad fixture; these prove it accepts good infrastructure
      # and still reaches into child modules (EXC-009).
      - name: Policy unit tests
        run: |
          set -euo pipefail
          pip install --quiet regopy
          python3 policies/test/test_policies.py

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive -diff

      # The gate produces a plan and must never touch shared state.
      #
      # -backend=false is enough for `validate` but not for `plan`: the config
      # declares a remote azurerm backend, and plan refuses to run against an
      # uninitialised one. Overriding the backend to `local` gives a throwaway
      # state file on the runner, so the gate works before the remote backend
      # exists and can never write to it afterwards.
      #
      # *_override.tf is gitignored, so this file is CI-only and never committed.
      - name: Terraform init + validate
        working-directory: terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The azurerm BACKEND authenticates independently of the provider.
          # azure/login leaves the Azure CLI authenticated, which the provider
          # picks up automatically, but the backend with use_oidc does not read
          # CLI credentials - it needs these two explicitly, or init fails with
          # "a Tenant ID must be configured when authenticating with OIDC".
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          echo "--- backend_override.tf ---"; cat backend_override.tf

          terraform init -input=false
          terraform validate

      - name: Terraform plan
        if: github.actor != 'dependabot[bot]'
        working-directory: terraform
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The azurerm BACKEND authenticates independently of the provider.
          # azure/login leaves the Azure CLI authenticated, which the provider
          # picks up automatically, but the backend with use_oidc does not read
          # CLI credentials - it needs these two explicitly, or init fails with
          # "a Tenant ID must be configured when authenticating with OIDC".
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          echo "Plan generated: $(wc -c < plan.json) bytes"

      - name: tfsec static scan
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: true # Advisory: Conftest below is the blocking control

      - name: GDPR policy gate (Conftest)
        if: github.actor != 'dependabot[bot]'
        working-directory: terraform
        run: |
          set +e
          conftest test plan.json --policy ../policies --all-namespaces --output table \
            > conftest.txt 2>&1
          status=$?
          set -e

          cat conftest.txt

          POLICIES=$(ls ../policies/*.rego | wc -l | tr -d ' ')
          RESOURCES=$(jq '[.planned_values.root_module.resources[]?] | length' plan.json 2>/dev/null || echo "?")

          {
            echo "### GDPR policy evaluation"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Policies evaluated | ${POLICIES} |"
            echo "| Resources in plan | ${RESOURCES} |"
            echo "| Result | $([ $status -eq 0 ] && echo 'PASS - no violations' || echo 'FAIL') |"
            echo ""
            echo '```'
            cat conftest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit $status

      - name: Upload plan evidence
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: reference-plan-${{ github.run_number }}
          path: terraform/plan.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            {
              echo "## Policy gate - REDUCED (Dependabot)"
              echo ""
              echo "Ran: \`terraform fmt\`, \`init\`, \`validate\`."
              echo "Skipped: plan and GDPR policy evaluation - Dependabot runs"
              echo "cannot obtain an OIDC token, so no Azure call can succeed."
              echo ""
              echo "A provider bump that breaks schema compatibility is still"
              echo "caught by \`validate\`. Policy compliance is **not** verified"
              echo "on this run - review the diff before merging."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## Policy gate - reference architecture"
            echo ""
            echo "Evaluated \`terraform/\` (the Part 1/2 target state) against"
            echo "$(ls policies/*.rego | wc -l) GDPR policies."
            echo ""
            echo "This configuration is **planned and gated, never applied** -"
            echo "it costs roughly EUR 240/month and its private endpoints are"
            echo "unreachable from a hosted runner. See \`docs/EXCEPTIONS.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

  ############################################################################
  # 2. Negative test - prove the gate rejects bad infrastructure
  ############################################################################
  policy-gate-negative:
    name: Policy gate negative test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Skipped for Dependabot: OIDC is unavailable on those runs.
      - name: Azure login (OIDC)
        if: github.actor != 'dependabot[bot]'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Validate the fixture offline (Dependabot)
        if: github.actor == 'dependabot[bot]'
        working-directory: policies/fixtures/noncompliant
        run: |
          terraform init -backend=false
          terraform validate
          echo "Reduced gate: fixture validated, policy assertion skipped (no OIDC on Dependabot runs)." >> "$GITHUB_STEP_SUMMARY"

      - name: Plan the non-compliant fixture
        if: github.actor != 'dependabot[bot]'
        working-directory: policies/fixtures/noncompliant
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The azurerm BACKEND authenticates independently of the provider.
          # azure/login leaves the Azure CLI authenticated, which the provider
          # picks up automatically, but the backend with use_oidc does not read
          # CLI credentials - it needs these two explicitly, or init fails with
          # "a Tenant ID must be configured when authenticating with OIDC".
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          # No backend block in the fixture, so this defaults to local state.
          terraform init -input=false
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json

      # The assertion: Conftest MUST exit non-zero here. If it passes, the
      # policies have regressed and this job fails the pipeline.
      - name: Assert the gate REJECTS the fixture
        if: github.actor != 'dependabot[bot]'
        working-directory: policies/fixtures/noncompliant
        run: |
          set +e
          conftest test plan.json \
            --policy ../../. \
            --all-namespaces \
            --output table
          status=$?
          set -e

          echo ""
          if [ $status -eq 0 ]; then
            echo "::error::POLICY REGRESSION - the gate ACCEPTED a configuration that violates every GDPR rule."
            {
              echo "## Negative test FAILED"
              echo ""
              echo "Conftest accepted the non-compliant fixture. The GDPR policies"
              echo "are no longer enforcing. Treat this as a control failure."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Gate correctly rejected the fixture (conftest exit code $status)."

          conftest test plan.json --policy ../../. --all-namespaces --output table \
            > violations.txt 2>&1 || true
          conftest test plan.json --policy ../../. --all-namespaces --output json \
            > violations.json 2>/dev/null || true

          VIOLATIONS=$(jq '[.[].failures // [] | length] | add // 0' violations.json 2>/dev/null || echo 0)
          POLICY_FILES=$(jq -r '[.[].namespace] | unique | length' violations.json 2>/dev/null || echo 0)

          {
            echo "## Negative test PASSED - the gate rejected non-compliant infrastructure"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Fixture | \`policies/fixtures/noncompliant/\` |"
            echo "| Expected | Conftest REJECTS |"
            echo "| Actual | Rejected (exit code $status) |"
            echo "| Violations detected | **${VIOLATIONS}** |"
            echo "| Policy files triggered | ${POLICY_FILES} |"
            echo ""
            echo "The fixture deliberately violates every GDPR policy: public"
            echo "storage, TLS 1.0, no customer-managed key, periodic backup"
            echo "instead of continuous, an unrotated Key Vault key, Owner at"
            echo "subscription scope, and an API allowing plaintext HTTP."
            echo ""
            echo "<details><summary>Full policy output</summary>"
            echo ""
            echo '```'
            cat violations.txt
            echo '```'
            echo ""
            echo "</details>"
            echo ""
            echo "**Why this job exists.** An all-green pipeline cannot"
            echo "distinguish *the infrastructure is compliant* from *the"
            echo "policies stopped working*. A gate that has never failed is not"
            echo "evidence of control. This job fails the build if the gate ever"
            echo "accepts the fixture."
          } >> "$GITHUB_STEP_SUMMARY"

          cp violations.txt "$GITHUB_WORKSPACE/negative-test-evidence.txt"
          cp violations.json "$GITHUB_WORKSPACE/negative-test-evidence.json" 2>/dev/null || true

      - name: Upload negative test evidence
        if: always() && github.actor != 'dependabot[bot]'
        uses: actions/upload-artifact@v7
        with:
          name: negative-test-evidence-${{ github.run_number }}
          path: |
            negative-test-evidence.txt
            negative-test-evidence.json
          retention-days: 90
          if-no-files-found: ignore

  ############################################################################
  # 3. Deploy the affordable governance plane
  ############################################################################
  deploy-demo:
    name: Deploy governance plane (demo)
    runs-on: ubuntu-latest
    needs: [policy-gate, policy-gate-negative]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_demo
    environment: medivault-demo

    steps:
      - uses: actions/checkout@v7

      # Skipped for Dependabot: OIDC is unavailable on those runs.
      - name: Azure login (OIDC)
        if: github.actor != 'dependabot[bot]'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Install Conftest + Cosign
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin conftest

      - uses: sigstore/cosign-installer@v3

      - name: Terraform apply (minimal)
        id: apply
        working-directory: terraform/minimal
        env:
          ARM_USE_OIDC: "true"
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The azurerm BACKEND authenticates independently of the provider.
          # azure/login leaves the Azure CLI authenticated, which the provider
          # picks up automatically, but the backend with use_oidc does not read
          # CLI credentials - it needs these two explicitly, or init fails with
          # "a Tenant ID must be configured when authenticating with OIDC".
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          # Region availability varies by subscription and changes over time, so
          # it is a variable rather than a constant. create-state-backend.sh
          # probes for a working EU region and prints the value to set here.
          TF_VAR_location: ${{ vars.AZURE_LOCATION || 'germanywestcentral' }}
        run: |
          set -euo pipefail

          # bootstrap.sh creates the state backend non-fatally and last, so a
          # missing account is plausible. Say so here rather than surfacing it
          # as an opaque backend error.
          if ! az storage account show \
                 --name "${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
                 --resource-group "${{ vars.TFSTATE_RESOURCE_GROUP }}" >/dev/null 2>&1; then
            echo "::error::State storage account ${{ vars.TFSTATE_STORAGE_ACCOUNT }} not found in ${{ vars.TFSTATE_RESOURCE_GROUP }}. Re-run scripts/bootstrap.sh."
            exit 1
          fi

          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate"
          terraform plan -out=tfplan -input=false
          terraform show -json tfplan > plan.json
          terraform apply -auto-approve -input=false tfplan
          terraform output -json > outputs.json

          echo "storage_account=$(jq -r '.evidence_vault_storage_account.value' outputs.json)" >> "$GITHUB_OUTPUT"

      # Advisory only. The demo deployment knowingly violates the public-access
      # policies (EXC-001, EXC-002) so it can be reached from a hosted runner.
      # Findings are recorded, not suppressed, and not allowed to block.
      - name: Record accepted deviations (advisory)
        working-directory: terraform/minimal
        run: |
          set +e
          conftest test plan.json --policy ../../policies --all-namespaces --output table \
            > deviations.txt 2>&1
          set -e

          {
            echo "## Accepted deviations - demo deployment"
            echo ""
            echo "The demo governance plane deliberately fails the public-access"
            echo "policies so that a GitHub-hosted runner can reach it. Each"
            echo "deviation is registered in \`docs/EXCEPTIONS.md\`."
            echo ""
            echo '```'
            cat deviations.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle and sign evidence
        working-directory: terraform/minimal
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp plan.json outputs.json deviations.txt evidence/

          cat > evidence/manifest.json <<EOF
          {
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "configuration": "terraform/minimal",
            "note": "Demo governance plane. Deviations from target architecture recorded in docs/EXCEPTIONS.md"
          }
          EOF

          tar -czf evidence-${{ github.run_number }}.tar.gz -C evidence .

          # Keyless signing: identity is the GitHub OIDC token, logged to the
          # public Rekor transparency log. No signing key to store or rotate.
          COSIGN_EXPERIMENTAL=1 cosign sign-blob \
            --yes \
            --output-signature evidence-${{ github.run_number }}.tar.gz.sig \
            --output-certificate evidence-${{ github.run_number }}.tar.gz.pem \
            evidence-${{ github.run_number }}.tar.gz

      - name: Upload evidence to the evidence vault
        working-directory: terraform/minimal
        run: |
          set -euo pipefail
          ACCOUNT="${{ steps.apply.outputs.storage_account }}"
          PREFIX="evidence-vault/runs/${{ github.run_number }}"

          for f in evidence-${{ github.run_number }}.tar.gz*; do
            az storage blob upload \
              --account-name "$ACCOUNT" \
              --container-name evidence-vault \
              --name "$PREFIX/$f" \
              --file "$f" \
              --auth-mode login \
              --overwrite
            echo "uploaded $PREFIX/$f"
          done

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: signed-evidence-${{ github.run_number }}
          path: terraform/minimal/evidence-${{ github.run_number }}.tar.gz*
          retention-days: 90
