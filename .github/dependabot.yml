# ─────────────────────────────────────────────────────────────────────────────
# PAUSED during active development.
#
# open-pull-requests-limit: 0 stops Dependabot opening version-update PRs while
# leaving this configuration in place as the record of intent. Set the limits
# back to their previous values once the repository has settled.
#
# Why: a dependency bot assumes a repository whose shape is stable. While files
# are being renamed, workflows rewritten and history rebased, every automated PR
# moves main underneath in-flight work and turns each push into a conflict
# resolution. The updates were also landing unreviewed simply to clear the
# queue - actions/checkout v4 to v7 and upload-artifact v4 to v7 were merged
# that way, which is the opposite of what the bot is for.
#
# NOTE: this does not affect Dependabot SECURITY alerts, which are a repository
# setting rather than part of this file. Vulnerability notifications continue.
# ─────────────────────────────────────────────────────────────────────────────
# Dependabot
#
# Supply chain matters more than usual here: a compromised GitHub Action runs
# with `id-token: write`, which means it can mint an Azure access token. Pinning
# and patching Actions is an identity control, not just hygiene.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 0   # paused (was 5)
    labels: ["dependencies", "security"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Azure and Terraform tooling move together; one PR is easier to review
      # than four, and the blast radius is identical.
      azure-tooling:
        patterns:
          - "azure/*"
          - "hashicorp/*"
      actions-core:
        patterns:
          - "actions/*"

  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # paused (was 3)
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(deps)"
    # Major provider bumps are breaking and must be a deliberate, tested
    # migration - not an automated PR. azurerm 3.x -> 4.x requires
    # subscription_id on the provider block and renames resource attributes;
    # merging it unreviewed would break the policy gate and the deployment.
    #
    # Minor and patch updates still flow through automatically.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/azuread"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "terraform"
    directory: "/terraform/minimal"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # paused (was 3)
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(deps)"
    # Major provider bumps are breaking and must be a deliberate, tested
    # migration - not an automated PR. azurerm 3.x -> 4.x requires
    # subscription_id on the provider block and renames resource attributes;
    # merging it unreviewed would break the policy gate and the deployment.
    #
    # Minor and patch updates still flow through automatically.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/azuread"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "terraform"
    directory: "/terraform/baseline"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0   # paused (was 3)
    labels: ["dependencies", "terraform"]
    commit-message:
      prefix: "chore(deps)"
    # Major provider bumps are breaking and must be a deliberate, tested
    # migration - not an automated PR. azurerm 3.x -> 4.x requires
    # subscription_id on the provider block and renames resource attributes;
    # merging it unreviewed would break the policy gate and the deployment.
    #
    # Minor and patch updates still flow through automatically.
    ignore:
      - dependency-name: "hashicorp/azurerm"
        update-types: ["version-update:semver-major"]
      - dependency-name: "hashicorp/azuread"
        update-types: ["version-update:semver-major"]
