# MediVault — GRC Gate (Azure adaptation)
#
# AWS source:  cgep-acme-health/.github/workflows/grc-gate.yml
# This file:   medivault-azure/.github/workflows/grc-gate.yml
#
# Key changes from the AWS version:
#   aws-actions/configure-aws-credentials → azure/login@v2 with OIDC
#   terraform backend: azurerm (storage blob lease locking, no DynamoDB)
#   ARM_USE_OIDC: "true" → Terraform uses federated credentials for Azure
#   HIPAA OPA namespaces → GDPR OPA namespaces
#   aws s3 cp evidence → az storage blob upload-batch
#   Evidence vault: Azure Blob with immutability vs S3 Object Lock
#
# Pre-requisites in GitHub repository:
#   Variables (vars.*):
#     AZURE_CLIENT_ID         — App Registration client ID (federated credential)
#     AZURE_TENANT_ID         — Entra ID tenant ID
#     AZURE_SUBSCRIPTION_ID   — Azure subscription ID
#     EVIDENCE_VAULT_STORAGE_ACCOUNT — from terraform output evidence_vault_storage_account_name
#   No secrets required — OIDC eliminates long-lived credentials.

name: grc-gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Required for OIDC token exchange
  contents: read
  pull-requests: write

env:
  TF_WORKING_DIR: terraform
  ARM_CLIENT_ID:       ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID:       ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC:        "true"  # Tells azurerm provider to use the OIDC token

jobs:
  grc-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # OIDC login to Azure — replaces aws-actions/configure-aws-credentials.
      # The Entra ID App Registration must have a federated credential configured
      # for the repository and branch (subject: repo:org/repo:ref:refs/heads/main).
      - name: Azure Login (OIDC — no long-lived secrets)
        uses: azure/login@v2
        with:
          client-id:       ${{ vars.AZURE_CLIENT_ID }}
          tenant-id:       ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install OPA + Conftest
        run: |
          curl -L -o conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz
          sudo mv conftest /usr/local/bin/

          curl -L -o opa \
            https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa
          sudo mv opa /usr/local/bin/

      - name: Install Cosign (evidence signing)
        if: always()
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'

      # tfsec and Checkov scan the Terraform source for misconfigurations
      # before the plan is generated. Catches issues the OPA gate might miss
      # because they exist in configuration rather than planned values.
      - name: IaC Static Scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: ${{ env.TF_WORKING_DIR }}
          soft_fail: false

      - name: Terraform Init + Validate + Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false

          terraform validate

          terraform plan \
            -out=tfplan \
            -no-color | tee plan.txt

          # Export plan as JSON for OPA/Conftest policy evaluation.
          # The plan.json structure mirrors cgep-acme-health's approach.
          terraform show -json tfplan > plan.json

      - name: Run OPA unit tests
        run: opa test -v policies/

      # GDPR policy gate — Azure equivalent of the HIPAA gate in cgep-acme-health.
      # Each namespace maps to a Rego file in policies/ and validates a specific
      # GDPR / NIS2 control requirement against the Terraform plan JSON.
      - name: GDPR policy gate (Conftest)
        run: |
          for ns in \
            compliance.gdpr.adls_encryption \
            compliance.gdpr.no_public_storage \
            compliance.gdpr.keyvault_key_rotation \
            compliance.gdpr.cosmos_pitr \
            compliance.gdpr.api_logging \
            compliance.gdpr.rbac_no_wildcard
          do
            echo "=== $ns ==="
            conftest test \
              --policy policies \
              --namespace "$ns" \
              terraform/plan.json
          done

      # Only apply on push to main (not PRs). Matches cgep-acme-health behaviour.
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # Bundle and sign CI/CD evidence with Cosign (same approach as cgep-acme-health).
      # The bundle is uploaded to the Azure Blob evidence vault instead of S3.
      - name: Bundle + sign evidence
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail

          mkdir -p evidence
          cp terraform/plan.json evidence/plan.json
          cp terraform/plan.txt  evidence/plan.txt  2>/dev/null || true

          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          tar czf "${BUNDLE}" evidence/

          shasum -a 256 "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"

          # Keyless signing via Sigstore — same as cgep-acme-health.
          cosign sign-blob --yes --bundle "${BUNDLE}.sig.bundle" "${BUNDLE}"

          cp "${BUNDLE}"            evidence/
          cp "${BUNDLE}.sha256"     evidence/
          cp "${BUNDLE}.sig.bundle" evidence/

      # Upload to Azure Blob evidence vault — replaces `aws s3 cp` in cgep-acme-health.
      # The storage account name is a Terraform output (evidence_vault_storage_account_name).
      - name: Upload signed evidence to Azure Blob vault
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          VAULT_FALLBACK: ${{ vars.EVIDENCE_VAULT_STORAGE_ACCOUNT }}
          RUN_ID: ${{ github.run_id }}
          SHA:    ${{ github.sha }}
        run: |
          set -euo pipefail

          # Prefer the storage account name from Terraform output; fall back to the variable.
          VAULT="$(terraform -chdir="${TF_WORKING_DIR}" output -raw evidence_vault_storage_account_name 2>/dev/null || true)"
          VAULT="${VAULT:-${VAULT_FALLBACK:-}}"

          if [ -z "${VAULT}" ]; then
            echo "No evidence vault storage account available from Terraform output or EVIDENCE_VAULT_STORAGE_ACCOUNT variable." >&2
            exit 1
          fi

          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          KEY_PREFIX="runs/${RUN_ID}"

          # Upload using the OIDC-authenticated az CLI session from the login step.
          az storage blob upload-batch \
            --account-name "${VAULT}" \
            --destination "evidence-vault/${KEY_PREFIX}" \
            --source evidence/ \
            --auth-mode login \
            --overwrite false  # Immutability: never overwrite existing evidence

          # Write a receipt for audit trail correlation (mirrors cgep-acme-health receipt.json)
          cat > receipt.json <<EOF
          {
            "run_id":    "${RUN_ID}",
            "vault":     "${VAULT}",
            "prefix":    "${KEY_PREFIX}",
            "bundle":    "${BUNDLE}",
            "sha256":    "$(cat ${BUNDLE}.sha256)",
            "commit":    "${SHA}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

          az storage blob upload \
            --account-name "${VAULT}" \
            --container-name "evidence-vault" \
            --name "${KEY_PREFIX}/receipt.json" \
            --file receipt.json \
            --auth-mode login

      - name: Upload GitHub evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
